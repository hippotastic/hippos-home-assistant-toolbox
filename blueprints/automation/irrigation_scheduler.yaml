blueprint:
  name: Hippo's Irrigation Scheduler
  description: >-
    Create one scheduler after configuring the Irrigation Zone Calculation for
    every zone. Select each zone's dedicated Text helper exactly once and in the
    desired watering order. The scheduler runs one zone at a time and distributes
    each cycle's demand across the available daily start times. Shortly before
    every start time, it asks the zone calculations to prepare the upcoming slot.
  domain: automation
  source_url: https://github.com/hippotastic/hippos-home-assistant-toolbox/blob/main/blueprints/automation/irrigation_scheduler.yaml
  author: Hippo
  homeassistant:
    min_version: 2024.6.0
  input:
    zone_section:
      name: " 🌱 Zones"
      collapsed: false
      input:
        zone_status_helper_entities:
          name: Zone state helpers
          description: >-
            Select the dedicated Text helper created for every zone. Use each helper
            exactly once. Zones that are ready at the same time run one after another
            in the order shown here.
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_text
    time_section:
      name: " 🕒 Daily start times"
      collapsed: false
      input:
        irrigation_start_time:
          name: Primary daily start time
          description: >-
            The first daily opportunity to water and the anchor of each planning
            cycle. Remaining demand may use this time again on following days before
            the cycle ends. The upcoming slot is prepared two minutes earlier.
          default: '23:00:00'
          selector:
            time:
        secondary_irrigation_start_time:
          name: Additional daily start time
          description: >-
            Optional. Used only when demand remains because a zone reached its
            maximum duration per run. If this time is earlier than the primary time,
            it means the following morning. The upcoming slot is prepared two
            minutes earlier. Leave empty to disable it.
          default: null
          selector:
            time:

    pump_section:
      name: " ⚙️ Master pump — optional"
      collapsed: true
      input:
        master_pump_entity:
          name: Master pump
          description: >-
            An optional switch shared by all zones. It starts 10 seconds before a
            zone valve and remains on while the scheduler hands over between zones.
          default: []
          selector:
            entity:
              filter:
                - domain: switch

trigger_variables:
  zone_status_helper_entities: !input zone_status_helper_entities
  master_pump_entity: !input master_pump_entity
  irrigation_start_time: !input irrigation_start_time
  secondary_irrigation_start_time: !input secondary_irrigation_start_time
  zone_status_settle_seconds: 5 # @blueprint-test-value 0.1
  master_pump_settle_seconds: 10 # @blueprint-test-value 0.1
  startup_settle_seconds: 30 # @blueprint-test-value 0.1
  slot_preparation_lead_seconds: 120

triggers:
  - trigger: template
    value_template: '{{ this is defined and this is not none and is_state(this.entity_id, "on") }}'
    id: trigger_automation_enabled
  - trigger: homeassistant
    event: start
    id: trigger_ha_restarted
  - trigger: state
    entity_id: !input zone_status_helper_entities
    not_to: [unavailable, unknown, none, query failed]
    for:
      seconds: >-
        {{ zone_status_settle_seconds * iif(trigger.from_state.state in ["unavailable", "unknown", "none", "query failed"], 2, 1) }}
    id: trigger_zone_status_changed
  - trigger: time
    at: !input irrigation_start_time
    id: trigger_primary_start_time
  - trigger: template
    value_template: >-
      {{
        now().strftime("%H:%M") ==
        (today_at(irrigation_start_time) - timedelta(seconds=slot_preparation_lead_seconds)).strftime("%H:%M")
      }}
    id: trigger_primary_slot_preparing
  - trigger: template
    value_template: >-
      {{ secondary_irrigation_start_time and secondary_irrigation_start_time != irrigation_start_time and
        now().strftime("%H:%M") == today_at(secondary_irrigation_start_time).strftime("%H:%M") }}
    id: trigger_secondary_start_time
  - trigger: template
    value_template: >-
      {{
        secondary_irrigation_start_time and secondary_irrigation_start_time != irrigation_start_time and
        now().strftime("%H:%M") ==
        (today_at(secondary_irrigation_start_time) - timedelta(seconds=slot_preparation_lead_seconds)).strftime("%H:%M")
      }}
    id: trigger_secondary_slot_preparing

condition:
  # Changes to the generated next run do not recursively restart the scheduler.
  # Completion fields remain material so a finished run immediately schedules its successor.
  - >-
      {%- if trigger.id | default("") != "trigger_zone_status_changed" %}
        {{ true }}
      {%- else %}
        {%- set old_status = trigger.from_state.state | from_json({}) %}
        {%- set new_status = trigger.to_state.state | from_json({}) %}
        {%- set old_status = old_status if old_status is mapping else {} %}
        {%- set new_status = new_status if new_status is mapping else {} %}
        {%- set old_status = old_status | dictsort |
          rejectattr("0", "eq", "next") | rejectattr("0", "eq", "r") | list %}
        {%- set new_status = new_status | dictsort |
          rejectattr("0", "eq", "next") | rejectattr("0", "eq", "r") | list %}
        {{ dict(old_status) != dict(new_status) }}
      {%- endif %}

mode: restart
max_exceeded: silent

variables:
  zone_status_properties:
    - valve
    - interval
    - runtime
    - max_runtime
    - last_end
    - cycle
    - watered
    - slot
    - next
    - r
  trigger_id: '{{ trigger.id | default("") }}'
  is_slot_preparation: >-
    {{ trigger_id in ["trigger_primary_slot_preparing", "trigger_secondary_slot_preparing"] }}
  prepared_slot_kind: >-
    {{ "primary" if trigger_id == "trigger_primary_slot_preparing" else "secondary" }}
  prepared_slot_start: >-
    {%- if is_slot_preparation %}
      {%- set slot_time = irrigation_start_time
        if prepared_slot_kind == "primary" else secondary_irrigation_start_time %}
      {%- set start = today_at(slot_time) %}
      {{ start + timedelta(days=1) if start <= now() else start }}
    {%- else %}
      {{ none }}
    {%- endif %}
  # Primary preparation plans against the imminent slot so a new interval is
  # committed before the exact start-time trigger needs to open its first valve.
  planning_time: '{{ prepared_slot_start if is_slot_preparation else now() }}'
  secondary_offset_seconds: >-
    {%- if secondary_irrigation_start_time and secondary_irrigation_start_time != irrigation_start_time %}
      {%- set offset = (today_at(secondary_irrigation_start_time) - today_at(irrigation_start_time)).total_seconds() | int %}
      {{ offset + iif(offset <= 0, 86400, 0) }}
    {%- else %}
      0
    {%- endif %}
  slots_per_day: '{{ iif(secondary_offset_seconds > 0, 2, 1) }}'
  all_zones: >-
    {%- set ns = namespace(zones=[]) %}
    {%- for zone_helper in zone_status_helper_entities %}
      {%- set zone = states(zone_helper) | from_json({}) %}
      {%- if zone is mapping and zone.get("valve") %}
        {#- Accept legacy schedules until the first compact schedule is written. #}
        {%- if not zone.get("next") and zone.get("next_start") and zone.get("next_end") %}
          {%- set duration = (zone.next_end | as_datetime - zone.next_start | as_datetime).total_seconds() | round(0, "ceil") | int %}
          {%- set zone = dict(zone, next=[zone.next_start, duration, 0]) %}
        {%- endif %}
        {%- set zone = dict(zone, helper_entity=zone_helper, helper_index=loop.index0) %}
        {%- set ns.zones = ns.zones + [zone] %}
      {%- endif %}
    {%- endfor %}
    {{ ns.zones }}
  startup_delay: >-
    {%- set ns = namespace(delay=0) %}
    {%- if trigger.id | default("") == "trigger_ha_restarted" %}
      {%- set ns.delay = startup_settle_seconds %}
    {%- endif %}
    {%- for zone in all_zones %}
      {%- if states(zone.valve) not in ["on", "off"] %}
        {%- set ns.delay = startup_settle_seconds %}
      {%- endif %}
    {%- endfor %}
    {{ ns.delay }}
  currently_scheduled_zone: >-
    {%- set ns = namespace(zone=None) %}
    {%- for zone in all_zones %}
      {%- set next_run = zone.get("next") %}
      {%- if ns.zone is none and next_run is sequence and next_run | count >= 2 %}
        {%- set run_start = next_run[0] | as_datetime %}
        {%- set run_end = run_start + timedelta(seconds=next_run[1]) %}
        {%- if now() >= run_start and now() < run_end %}
          {%- set ns.zone = dict(zone, run_start=run_start.isoformat(), run_end=run_end.isoformat()) %}
        {%- endif %}
      {%- endif %}
    {%- endfor %}
    {{ ns.zone }}
  remaining_runtime_seconds: >-
    {%- if currently_scheduled_zone is not none %}
      {{ [0, (currently_scheduled_zone.run_end | as_datetime - now()).total_seconds() | round(0, "ceil")] | max }}
    {%- else %}
      0
    {%- endif %}
  is_controlling_zones: >-
    {%- set ns = namespace(result=false) %}
    {%- for zone in all_zones %}
      {%- set next_run = zone.get("next") %}
      {%- if next_run is sequence and next_run | count >= 2 %}
        {%- set run_start = next_run[0] | as_datetime %}
        {%- set run_end = run_start + timedelta(seconds=next_run[1]) %}
        {%- if now() >= run_start and now() < run_end + timedelta(minutes=30) %}
          {%- set ns.result = true %}
        {%- endif %}
      {%- endif %}
      {%- if zone.get("last_end") and now() < zone.last_end | as_datetime + timedelta(minutes=30) %}
        {%- set ns.result = true %}
      {%- endif %}
    {%- endfor %}
    {{ ns.result }}

actions:
  - if:
      - condition: template
        value_template: '{{ is_slot_preparation }}'
    then:
      - event: hippos_irrigation_slot_preparing
        event_data:
          zone_status_helper_entities: '{{ zone_status_helper_entities }}'
          slot: '{{ prepared_slot_kind }}'
          start: '{{ prepared_slot_start }}'

  - delay:
      seconds: '{{ startup_delay }}'

  - if:
      - condition: template
        value_template: '{{ is_controlling_zones }}'
    then:
      - repeat:
          for_each: '{{ all_zones }}'
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{
                      states(repeat.item.valve) == "on" and
                      (currently_scheduled_zone is none or repeat.item.valve != currently_scheduled_zone.valve)
                    }}
              then:
                - action: logbook.log
                  data:
                    name: Hippo's Irrigation Scheduler
                    message: Stopped watering because scheduled run ended or another zone is starting.
                    entity_id: '{{ repeat.item.valve }}'
                    domain: switch
                - action: switch.turn_off
                  target:
                    entity_id: '{{ repeat.item.valve }}'
                - action: input_text.set_value
                  target:
                    entity_id: '{{ repeat.item.helper_entity }}'
                  data:
                    value: >-
                      {%- set zone = states(repeat.item.helper_entity) | from_json({}) %}
                      {%- set zone = zone if zone is mapping else {} %}
                      {%- set zone = dict(zone | dictsort |
                        selectattr("0", "in", zone_status_properties) | list) %}
                      {{ dict(zone, last_end=now().isoformat()) | to_json }}

  - if:
      - condition: template
        value_template: >-
          {{ is_controlling_zones and currently_scheduled_zone is none and master_pump_entity and states(master_pump_entity) == "on" }}
    then:
      - delay:
          seconds: '{{ master_pump_settle_seconds }}'
      - action: switch.turn_off
        target:
          entity_id: '{{ master_pump_entity }}'

  # Once started, a run is immutable. Runtime recalculations restart this
  # automation but continue against the original stored end time.
  - if:
      - condition: template
        value_template: '{{ currently_scheduled_zone is not none }}'
    then:
      - if:
          - condition: template
            value_template: '{{ master_pump_entity and states(master_pump_entity) != "on" }}'
        then:
          - action: switch.turn_on
            target:
              entity_id: '{{ master_pump_entity }}'
          - delay:
              seconds: '{{ master_pump_settle_seconds }}'
      - if:
          - condition: template
            value_template: '{{ states(currently_scheduled_zone.valve) != "on" }}'
        then:
          - action: logbook.log
            data:
              name: Hippo's Irrigation Scheduler
              message: >-
                {%- set display = (currently_scheduled_zone.next[1] / 60) | round(0, "ceil") | int %}
                {%- set ns = namespace(message="Starting to water for " ~ display ~
                  " minute" ~ iif(display == 1, "", "s")) %}
                {%- if currently_scheduled_zone.next[1] < currently_scheduled_zone.runtime * 60 %}
                  {%- set demand = currently_scheduled_zone.runtime | int %}
                  {%- set ns.message = ns.message ~ " (out of " ~ demand ~
                    " minute" ~ iif(demand == 1, "", "s") ~ " watering demand)" %}
                {%- endif %}
                {{ ns.message ~ ". Scheduled end: " ~
                  (currently_scheduled_zone.run_end | as_datetime | as_local).strftime("%Y-%m-%d %H:%M") ~ "." }}
              entity_id: '{{ currently_scheduled_zone.valve }}'
              domain: switch
          - action: switch.turn_on
            target:
              entity_id: '{{ currently_scheduled_zone.valve }}'
      - delay:
          seconds: '{{ remaining_runtime_seconds }}'
      - action: logbook.log
        data:
          name: Hippo's Irrigation Scheduler
          message: >-
            {%- set completed_display = (currently_scheduled_zone.next[1] / 60) | round(0, "ceil") | int %}
            {%- set remaining_seconds = [0, currently_scheduled_zone.runtime * 60 -
              currently_scheduled_zone.get("watered", 0) - currently_scheduled_zone.next[1]] | max %}
            {%- set remaining_display = (remaining_seconds / 60) | round(0, "ceil") | int %}
            {%- set ns = namespace(message="Completed " ~ completed_display ~
              " minute" ~ iif(completed_display == 1, "", "s") ~ ".") %}
            {%- if remaining_display > 0 %}
              {%- set ns.message = ns.message ~ " Remaining watering demand: " ~
                remaining_display ~ " minute" ~ iif(remaining_display == 1, "", "s") ~ "." %}
              {%- set next_slot = currently_scheduled_zone.next[2] + 1 %}
              {%- set next_day = (next_slot / slots_per_day) | int %}
              {%- set next_is_secondary = slots_per_day == 2 and next_slot % 2 == 1 %}
              {%- set next_start = currently_scheduled_zone.cycle | as_datetime +
                timedelta(days=next_day, seconds=iif(next_is_secondary, secondary_offset_seconds, 0)) %}
              {%- set cycle_end = currently_scheduled_zone.cycle | as_datetime +
                timedelta(days=[1, currently_scheduled_zone.interval | int] | max) %}
              {%- if next_start < cycle_end %}
                {%- set ns.message = ns.message ~ " Next run: " ~
                  (next_start | as_local).strftime("%Y-%m-%d %H:%M") ~ "." %}
              {%- endif %}
            {%- endif %}
            {{ ns.message }}
          entity_id: '{{ currently_scheduled_zone.valve }}'
          domain: switch
      - action: input_text.set_value
        target:
          entity_id: '{{ currently_scheduled_zone.helper_entity }}'
        data:
          value: >-
            {%- set zone = states(currently_scheduled_zone.helper_entity) | from_json({}) %}
            {%- set zone = zone if zone is mapping else {} %}
            {%- set completed_run = zone.get("next", currently_scheduled_zone.next) %}
            {%- set zone = dict(zone | dictsort |
              selectattr("0", "in", zone_status_properties) | list) %}
            {%- set zone = dict(zone, last_end=now().isoformat(),
              watered=zone.get("watered", 0) + completed_run[1], slot=completed_run[2] + 1) %}
            {%- set zone = zone | dictsort | rejectattr("0", "eq", "next") | list %}
            {{ dict(zone) | to_json }}
      - delay:
          seconds: '{{ zone_status_settle_seconds * 2 }}'
      - if:
          - condition: template
            value_template: '{{ is_state(currently_scheduled_zone.valve, "on") }}'
        then:
          - action: logbook.log
            data:
              name: Hippo's Irrigation Scheduler
              message: >-
                The valve was still on after watering should have ended, so it was turned off automatically.
              entity_id: '{{ currently_scheduled_zone.valve }}'
              domain: switch
          - action: switch.turn_off
            target:
              entity_id: '{{ currently_scheduled_zone.valve }}'

  - if:
      - condition: template
        value_template: '{{ currently_scheduled_zone is none }}'
    then:
      - variables:
          scheduled_zones: >-
            {%- set ns = namespace(zones=[], scheduled=[], cursor=planning_time | as_datetime) %}
            {#- Establish or advance each zone's interval anchor. The anchor, not
                the most recent partial run, determines the next interval. #}
            {%- for zone in all_zones %}
              {%- set interval = [1, zone.get("interval", 1) | int] | max %}
              {%- set cycle = zone.get("cycle") %}
              {%- set reset_cycle = false %}
              {%- if cycle %}
                {%- set cycle = cycle | as_datetime %}
                {%- if planning_time | as_datetime >= cycle + timedelta(days=interval) %}
                  {%- set elapsed_cycles = (((planning_time | as_datetime) - cycle).total_seconds() / (interval * 86400)) | int %}
                  {%- set cycle = cycle + timedelta(days=elapsed_cycles * interval) %}
                  {%- set reset_cycle = true %}
                {%- endif %}
              {%- else %}
                {%- set cycle = today_at(irrigation_start_time) %}
                {%- if cycle < planning_time | as_datetime %}
                  {%- set cycle = cycle + timedelta(days=1) %}
                {%- endif %}
                {%- set last_end = zone.get("last_end") %}
                {%- if last_end %}
                  {%- set last_end = last_end | as_datetime %}
                  {%- set last_date = last_end.date() | as_datetime | as_local %}
                  {%- set last_cycle = last_date + irrigation_start_time | as_timedelta %}
                  {%- if last_cycle > last_end %}
                    {%- set last_cycle = last_cycle - timedelta(days=1) %}
                  {%- endif %}
                  {%- set eligible_cycle = last_cycle + timedelta(days=interval) %}
                  {%- if eligible_cycle > cycle %}
                    {%- set cycle = eligible_cycle %}
                  {%- endif %}
                {%- endif %}
                {%- set reset_cycle = true %}
              {%- endif %}
              {%- set watered = iif(reset_cycle, 0, zone.get("watered", 0)) | int %}
              {%- set slot = iif(reset_cycle, 0, zone.get("slot", 0)) | int %}
              {%- set next_run = none if reset_cycle else zone.get("next") %}
              {%- set active_commitment = 0 %}
              {%- if next_run is sequence and next_run | count >= 3 %}
                {%- set old_start = next_run[0] | as_datetime %}
                {%- set old_end = old_start + timedelta(seconds=next_run[1]) %}
                {%- if now() >= old_start and now() < old_end %}
                  {%- set active_commitment = next_run[1] | int %}
                  {%- set ns.cursor = old_end %}
                {%- endif %}
              {%- endif %}
              {%- set remaining = [0, zone.get("runtime", 0) * 60 - watered - active_commitment] | max | int %}
              {%- set day_index = (slot / slots_per_day) | int %}
              {%- set is_secondary = slots_per_day == 2 and slot % 2 == 1 %}
              {%- set slot_time = cycle + timedelta(days=day_index, seconds=iif(is_secondary, secondary_offset_seconds, 0)) %}
              {%- set cycle_end = cycle + timedelta(days=interval) %}
              {%- set zone = dict(zone, cycle=cycle.isoformat(), watered=watered, slot=slot,
                remaining=remaining, slot_time=slot_time.isoformat(), cycle_end=cycle_end.isoformat(),
                active_commitment=active_commitment) %}
              {%- set ns.zones = ns.zones + [zone] %}
            {%- endfor %}
            {#- Helper order breaks ties within the primary/secondary slot order. #}
            {%- set ns.zones = ns.zones | sort(attribute="helper_index") %}
            {%- set ns.zones = ns.zones | sort(attribute="slot_time") %}
            {%- for zone in ns.zones %}
              {%- set cycle_end = zone.cycle_end | as_datetime %}
              {%- set slot_time = zone.slot_time | as_datetime %}
              {%- set next_run = zone.get("next") %}
              {%- if zone.active_commitment > 0 %}
                {%- set changed = false %}
              {%- elif zone.remaining > 0 and slot_time < cycle_end %}
                {%- set run_start = [slot_time, ns.cursor] | max %}
                {%- set max_seconds = zone.get("max_runtime", 0) * 60 %}
                {%- set duration = zone.remaining if max_seconds <= 0 else [zone.remaining, max_seconds] | min %}
                {%- set duration = [duration, (cycle_end - run_start).total_seconds()] | min | int %}
                {%- if duration > 0 %}
                  {%- set next_run = [run_start.isoformat(), duration, zone.slot] %}
                  {%- set ns.cursor = run_start + timedelta(seconds=duration) %}
                  {%- set changed = zone.get("next") != next_run %}
                {%- else %}
                  {%- set next_run = none %}
                  {%- set changed = zone.get("next") is not none %}
                {%- endif %}
              {%- else %}
                {%- set next_run = none %}
                {%- set changed = zone.get("next") is not none %}
              {%- endif %}
              {%- set zone = dict(zone, next=next_run, schedule_changed=changed | int) %}
              {%- set ns.scheduled = ns.scheduled + [zone] %}
            {%- endfor %}
            {{ ns.scheduled }}

      - repeat:
          for_each: '{{ scheduled_zones }}'
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ not is_slot_preparation and not repeat.item.next and repeat.item.remaining > 0 }}
              then:
                - action: logbook.log
                  data:
                    name: Hippo's Irrigation Scheduler
                    message: >-
                      {%- set display = (repeat.item.remaining / 60) | round(0, "ceil") | int %}
                      Remaining watering demand: {{ display }}
                      minute{{ iif(display == 1, "", "s") }}.
                      No further run can be scheduled before the current cycle ends.
                    entity_id: '{{ repeat.item.valve }}'
                    domain: switch
            - action: input_text.set_value
              target:
                entity_id: '{{ repeat.item.helper_entity }}'
              data:
                value: >-
                  {%- set zone = states(repeat.item.helper_entity) | from_json({}) %}
                  {%- set zone = zone if zone is mapping else {} %}
                  {%- set zone = dict(zone | dictsort |
                    selectattr("0", "in", zone_status_properties) | list) %}
                  {%- set zone = zone | dictsort | rejectattr("0", "eq", "next") | list %}
                  {%- set zone = dict(zone, cycle=repeat.item.cycle,
                    watered=repeat.item.watered, slot=repeat.item.slot) %}
                  {%- if repeat.item.next %}
                    {%- set zone = dict(zone, next=repeat.item.next) %}
                  {%- endif %}
                  {{ zone | to_json }}
