blueprint:
  name: Hippo's Irrigation Zone Calculation
  description: >-
    Create one automation per irrigation zone. It calculates the total watering
    demand for each planning cycle and stores it in a dedicated Text helper for
    the Irrigation Scheduler. Create that helper with a maximum length of 255
    characters before configuring this automation.
  domain: automation
  source_url: https://github.com/hippotastic/hippos-home-assistant-toolbox/blob/main/blueprints/automation/irrigation_zone_calculation.yaml
  author: Hippo
  homeassistant:
    min_version: 2024.6.0
  input:
    zone_section:
      name: " 🌱 Zone and storage"
      collapsed: false
      input:
        valve_entity:
          name: Zone valve
          description: The switch that opens and closes this irrigation zone.
          selector:
            entity:
              filter:
                - domain: switch

        status_helper_entity:
          name: Zone state helper
          description: >-
            Select a dedicated Text helper with a maximum length of 255 characters.
            Do not reuse it for another zone or edit its contents manually. Select
            this same helper later in the Irrigation Scheduler.
          selector:
            entity:
              filter:
                - domain: input_text

    strategy_section:
      name: " 💧 Watering strategy"
      collapsed: false
      input:
        base_runtime_minutes:
          name: Reference runtime
          description: >-
            The unadjusted total watering demand for one planning cycle, not the
            duration of every individual run. Temperature may reduce this value to
            0 or increase it to 200%; low soil moisture may then double the
            temperature-adjusted result. Detected rain minutes are subtracted last.
          default: 10
          selector:
            number:
              min: 1
              max: 60
              step: 1
              unit_of_measurement: minutes

        watering_interval_days:
          name: Planning cycle length
          description: >-
            The number of days available to deliver the calculated total demand.
            For example, a three-day cycle may use the configured daily start times
            on all three days. Unscheduled demand expires when the next cycle begins.
          default: 1
          selector:
            number:
              min: 1
              max: 7
              step: 1
              unit_of_measurement: days

        maximum_runtime_minutes:
          name: Maximum duration per run
          description: >-
            Limits one uninterrupted watering run; 0 means unlimited. This does not
            cap the total demand. The scheduler distributes a longer demand across
            later primary and secondary start times within the planning cycle.
          default: 0
          selector:
            number:
              min: 0
              max: 240
              step: 1
              mode: box
              unit_of_measurement: minutes

    weather_section:
      name: " 🌦️ Weather sensors — required"
      collapsed: false
      input:
        rainfall_percentage_of_last_24h_entity:
          name: Rain duration percentage — last 24 hours
          description: >-
            Select a History Statistics sensor reporting the percentage of the last
            24 hours during which rain was detected, from 0 to 100. This is not
            precipitation in millimetres. Each detected rain minute is treated as one
            minute already supplied and subtracted from the adjusted cycle demand.
            An unavailable sensor is treated as no rain.
          selector:
            entity:
              filter:
                - domain:
                    - sensor

        max_temperature_of_last_24h_entity:
          name: Maximum temperature — last 24 hours
          description: >-
            Select a sensor reporting degrees Celsius. Below 12 °C watering is
            disabled. From 25 to 35 °C the temperature adjustment increases
            progressively, up to 200% of the reference runtime — a maximum increase
            of 100%. An unavailable sensor is treated as 20 °C.
          selector:
            entity:
              filter:
                - domain:
                  - sensor

    moisture_section:
      name: " 🌡️ Soil moisture — optional"
      collapsed: true
      input:
        soil_moisture_entity:
          name: Soil moisture sensor
          description: >-
            An optional sensor reporting a numeric value from 0 to 100%. If it is
            unavailable, no soil-moisture adjustment is applied.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor

        target_soil_moisture_percentage:
          name: Target soil moisture
          description: >-
            Used only when a soil-moisture sensor is selected. At or above the target,
            soil moisture does not reduce watering. Ten percentage points below the
            target add 50%; 20 or more add the maximum increase of 100%.
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"

trigger_variables:
  # Configuration inputs
  valve_entity: !input valve_entity
  status_helper_entity: !input status_helper_entity
  base_runtime_minutes: !input base_runtime_minutes
  watering_interval_days: !input watering_interval_days
  maximum_runtime_minutes: !input maximum_runtime_minutes
  rainfall_percentage_of_last_24h_entity: !input rainfall_percentage_of_last_24h_entity
  max_temperature_of_last_24h_entity: !input max_temperature_of_last_24h_entity
  soil_moisture_entity: !input soil_moisture_entity
  target_soil_moisture_percentage: !input target_soil_moisture_percentage

triggers:
  # The automation was enabled or any settings were changed
  - trigger: template
    value_template: '{{ this is defined and this is not none and is_state(this.entity_id, "on") }}'
    id: trigger_automation_enabled
  # Every hour at 58 minutes past whole
  - trigger: time_pattern
    minutes: 58
    id: trigger_time_based_update

# If the automation is triggered again while still being executed, restart it
mode: restart
max_exceeded: silent

variables:
  # Perform zone runtime calculation
  rainfall_pct: '{{ states(rainfall_percentage_of_last_24h_entity) | float(default=0) }}'
  max_temperature: '{{ states(max_temperature_of_last_24h_entity) | float(default=20) }}'
  rain_minutes: '{{ (24 * 60 * rainfall_pct / 100) | round(0, "ceil") | int }}'
  heat_factor: '{{ (0.7 + ([1, ([0, (max_temperature - 25) / 10] | max)] | min) * 1.3) | round(2) }}'
  cold_factor: '{{ iif(max_temperature < 12, 0, 1) }}'
  soil_moisture: >-
    {{
      states(soil_moisture_entity) | float(default=target_soil_moisture_percentage)
      if soil_moisture_entity else target_soil_moisture_percentage
    }}
  moisture_deficit: '{{ [0, target_soil_moisture_percentage - soil_moisture] | max }}'
  moisture_factor: '{{ 1 + ([1, moisture_deficit / 20] | min) }}'
  demand_factor: '{{ (heat_factor * cold_factor * moisture_factor) | round(2) }}'
  gross_runtime_minutes: '{{ (base_runtime_minutes * demand_factor) | round(0, "ceil") | int }}'
  runtime_minutes: '{{ [0, gross_runtime_minutes - rain_minutes] | max | int }}'
  # Get current value of status helper
  status: >-
    {%- set value = states(status_helper_entity) | from_json({}) %}
    {{ value if value is mapping else {} }}

actions:
  # Only continue if we need to update any of our output properties in the status helper
  - condition: template
    value_template: >-
      {{
        status.get("valve") != valve_entity or
        status.get("interval") != watering_interval_days or
        status.get("runtime") != runtime_minutes or
        status.get("max_runtime", 0) != maximum_runtime_minutes
      }}
  # Explain the changed watering requirement in the valve's logbook.
  - action: logbook.log
    data:
      name: Hippo's Irrigation Zone Calculation
      message: >-
        Calculated {{ runtime_minutes }} minutes for each
        {{ watering_interval_days }}-day planning cycle. Gross demand before rain:
        {{ gross_runtime_minutes }} minutes from a {{ base_runtime_minutes }}-minute
        reference runtime. Rain credit: {{ rain_minutes }} minutes
        ({{ rainfall_pct }}% of the last 24 hours);
        maximum temperature: {{ max_temperature }} °C.
        {%- if soil_moisture_entity %}
        Soil moisture: {{ soil_moisture }}%; target:
        {{ target_soil_moisture_percentage }}%; resulting increase:
        {{ ((moisture_factor - 1) * 100) | round(0) }}%.
        {%- endif %}
      entity_id: '{{ valve_entity }}'
      domain: switch
  # Keep the shared helper within its known schema before updating calculation fields.
  - action: input_text.set_value
    target:
      entity_id: '{{ status_helper_entity }}'
    data:
      value: >-
        {%- set status = dict(status | dictsort | selectattr("0", "in",
          ["valve", "interval", "runtime", "max_runtime", "last_end",
            "cycle", "watered", "slot", "next"]) | list) %}
        {%- set status = dict(status, valve=valve_entity,
          interval=watering_interval_days, runtime=runtime_minutes) %}
        {%- if maximum_runtime_minutes > 0 %}
          {%- set status = dict(status, max_runtime=maximum_runtime_minutes) %}
        {%- else %}
          {%- set status = status | dictsort | rejectattr("0", "eq", "max_runtime") | list %}
          {%- set status = dict(status) %}
        {%- endif %}
        {{ status | to_json }}
