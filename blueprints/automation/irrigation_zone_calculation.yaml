blueprint:
  name: Hippo's Irrigation Zone Calculation
  description: >-
    Create one automation per irrigation zone. It calculates the total watering
    demand for each planning cycle and stores it in a dedicated Text helper for
    the Irrigation Scheduler. Temperature and soil moisture are sampled when a
    cycle begins; before later slots, only additional rain can reduce the stored
    demand. Create that helper with a maximum length of 255 characters before
    configuring this automation.
  domain: automation
  source_url: https://github.com/hippotastic/hippos-home-assistant-toolbox/blob/main/blueprints/automation/irrigation_zone_calculation.yaml
  author: Hippo
  homeassistant:
    min_version: 2024.6.0
  input:
    zone_section:
      name: " 🌱 Zone and storage"
      collapsed: false
      input:
        valve_entity:
          name: Zone valve
          description: The switch that opens and closes this irrigation zone.
          selector:
            entity:
              filter:
                - domain: switch

        status_helper_entity:
          name: Zone state helper
          description: >-
            Select a dedicated Text helper with a maximum length of 255 characters.
            Do not reuse it for another zone or edit its contents manually. Select
            this same helper later in the Irrigation Scheduler.
          selector:
            entity:
              filter:
                - domain: input_text

    strategy_section:
      name: " 💧 Watering strategy"
      collapsed: false
      input:
        base_runtime_minutes:
          name: Reference runtime
          description: >-
            The unadjusted total watering demand for one planning cycle, not the
            duration of every individual run. Temperature may reduce this value to
            0 or increase it to 200%; low soil moisture may then double the
            temperature-adjusted result. The credited share of detected rain minutes
            is subtracted last.
          default: 10
          selector:
            number:
              min: 1
              max: 60
              step: 1
              unit_of_measurement: minutes

        watering_interval_days:
          name: Planning cycle length
          description: >-
            The number of days available to deliver the calculated total demand.
            For example, a three-day cycle may use the configured daily start times
            on all three days. Unscheduled demand expires when the next cycle begins.
          default: 1
          selector:
            number:
              min: 1
              max: 7
              step: 1
              unit_of_measurement: days

        maximum_runtime_minutes:
          name: Maximum duration per run
          description: >-
            Limits one uninterrupted watering run; 0 means unlimited. This does not
            cap the total demand. The scheduler distributes a longer demand across
            later primary and secondary start times within the planning cycle.
          default: 0
          selector:
            number:
              min: 0
              max: 240
              step: 1
              mode: box
              unit_of_measurement: minutes

    weather_section:
      name: " 🌦️ Weather sensors — required"
      collapsed: false
      input:
        rainfall_percentage_of_last_24h_entity:
          name: Rain duration percentage — last 24 hours
          description: >-
            Select a History Statistics sensor reporting the percentage of the last
            24 hours during which rain was detected, from 0 to 100. This is not
            precipitation in millimetres. The configured share of detected rain
            minutes is treated as already supplied and subtracted from the adjusted
            cycle demand. Before later slots, increases since the previous reading
            reduce the remaining demand; decreases caused by the sliding window do
            not increase it. An unavailable sensor is treated as no rain.
          selector:
            entity:
              filter:
                - domain:
                    - sensor

        rain_credit_percentage:
          name: Rain credit percentage
          description: >-
            Controls how detected rain reduces the calculated watering demand. At
            100%, each rain minute counts as one watering minute. Reduce this value
            if only some rain reaches the soil, for example because of a roof or
            plant canopy. Set it to 0 to ignore rain for this zone.
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"

        max_temperature_of_last_24h_entity:
          name: Maximum temperature — last 24 hours
          description: >-
            Select a sensor reporting degrees Celsius. Below 12 °C watering is
            disabled. From 25 to 35 °C the temperature adjustment increases
            progressively, up to 200% of the reference runtime — a maximum increase
            of 100%. The value is sampled at the beginning of each planning cycle
            and after configuration changes. An unavailable sensor is treated as
            20 °C.
          selector:
            entity:
              filter:
                - domain:
                  - sensor

    moisture_section:
      name: " 🌡️ Soil moisture — optional"
      collapsed: true
      input:
        soil_moisture_entity:
          name: Soil moisture sensor
          description: >-
            An optional sensor reporting a numeric value from 0 to 100%. If it is
            unavailable, no soil-moisture adjustment is applied. The value is
            sampled at the beginning of each planning cycle and after configuration
            changes.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor

        target_soil_moisture_percentage:
          name: Target soil moisture
          description: >-
            Used only when a soil-moisture sensor is selected. At or above the target,
            soil moisture does not reduce watering. Ten percentage points below the
            target add 50%; 20 or more add the maximum increase of 100%.
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"

trigger_variables:
  # Configuration inputs
  valve_entity: !input valve_entity
  status_helper_entity: !input status_helper_entity
  base_runtime_minutes: !input base_runtime_minutes
  watering_interval_days: !input watering_interval_days
  maximum_runtime_minutes: !input maximum_runtime_minutes
  rainfall_percentage_of_last_24h_entity: !input rainfall_percentage_of_last_24h_entity
  rain_credit_percentage: !input rain_credit_percentage
  max_temperature_of_last_24h_entity: !input max_temperature_of_last_24h_entity
  soil_moisture_entity: !input soil_moisture_entity
  target_soil_moisture_percentage: !input target_soil_moisture_percentage
  calculation_log_delay_seconds: 6 # @blueprint-test-value 0.2

triggers:
  # The automation was enabled or any settings were changed
  - trigger: template
    value_template: '{{ this is defined and this is not none and is_state(this.entity_id, "on") }}'
    id: trigger_automation_enabled
  # The scheduler requests one calculation shortly before a configured slot.
  - trigger: event
    event_type: hippos_irrigation_slot_preparing
    id: trigger_slot_preparing

# If the automation is triggered again while still being executed, restart it
mode: restart
max_exceeded: silent

variables:
  trigger_id: '{{ trigger.id | default("") }}'
  is_slot_request: '{{ trigger_id == "trigger_slot_preparing" }}'
  is_targeted_slot_request: >-
    {{
      not is_slot_request or
      status_helper_entity in trigger.event.data.get("zone_status_helper_entities", [])
    }}
  requested_slot_kind: >-
    {{ trigger.event.data.get("slot", "") if is_slot_request else "" }}
  requested_slot_start: >-
    {{ trigger.event.data.get("start") | as_datetime if is_slot_request else none }}
  # Get current value of status helper
  status: >-
    {%- set value = states(status_helper_entity) | from_json({}) %}
    {{ value if value is mapping else {} }}
  # A primary slot opens a new interval when it matches the stored anchor or
  # reaches the next interval boundary. Later slots only reconcile rain.
  is_interval_start: >-
    {{
      is_slot_request and requested_slot_kind == "primary" and (
        not status.get("cycle") or
        (requested_slot_start | as_datetime) == (status.get("cycle") | as_datetime) or
        (requested_slot_start | as_datetime) >= (status.get("cycle") | as_datetime) +
          timedelta(days=[1, watering_interval_days | int] | max)
      )
    }}
  is_rain_only_update: >-
    {{
      is_slot_request and not is_interval_start and
      status.get("runtime") is number and status.get("r") is number
    }}
  # Perform zone runtime calculation
  rainfall_pct: '{{ states(rainfall_percentage_of_last_24h_entity) | float(default=0) }}'
  max_temperature: '{{ states(max_temperature_of_last_24h_entity) | float(default=20) }}'
  rain_minutes: '{{ (24 * 60 * rainfall_pct / 100) | round(0, "ceil") | int }}'
  credited_rain_minutes: '{{ (rain_minutes * rain_credit_percentage / 100) | round(0, "floor") | int }}'
  heat_factor: '{{ (0.7 + ([1, ([0, (max_temperature - 25) / 10] | max)] | min) * 1.3) | round(2) }}'
  cold_factor: '{{ iif(max_temperature < 12, 0, 1) }}'
  soil_moisture: >-
    {{
      states(soil_moisture_entity) | float(default=target_soil_moisture_percentage)
      if soil_moisture_entity else target_soil_moisture_percentage
    }}
  moisture_deficit: '{{ [0, target_soil_moisture_percentage - soil_moisture] | max }}'
  moisture_factor: '{{ 1 + ([1, moisture_deficit / 20] | min) }}'
  temperature_runtime_minutes: '{{ (base_runtime_minutes * heat_factor * cold_factor) | round(0, "ceil") | int }}'
  temperature_adjustment_minutes: '{{ temperature_runtime_minutes - base_runtime_minutes }}'
  demand_factor: '{{ (heat_factor * cold_factor * moisture_factor) | round(2) }}'
  gross_runtime_minutes: '{{ (base_runtime_minutes * demand_factor) | round(0, "ceil") | int }}'
  soil_adjustment_minutes: '{{ gross_runtime_minutes - temperature_runtime_minutes }}'
  # Cap the displayed rain credit so every logged component adds up to the final runtime.
  applied_rain_minutes: '{{ [credited_rain_minutes, gross_runtime_minutes] | min | int }}'
  previous_rain_minutes: '{{ status.get("r", credited_rain_minutes) | int }}'
  additional_rain_minutes: '{{ [0, credited_rain_minutes - previous_rain_minutes] | max | int }}'
  fully_calculated_runtime_minutes: '{{ gross_runtime_minutes - applied_rain_minutes }}'
  # Between interval starts, only positive changes from the sliding rain
  # window reduce demand. Falling values never increase demand again.
  runtime_minutes: >-
    {{
      [0, status.get("runtime", 0) | int - additional_rain_minutes] | max | int
      if is_rain_only_update else
      fully_calculated_runtime_minutes
    }}
  runtime_changed: '{{ status.get("runtime") != runtime_minutes }}'
  watered_before_calculation: >-
    {{ 0 if is_interval_start else status.get("watered", 0) | int }}

actions:
  - condition: template
    value_template: '{{ is_targeted_slot_request }}'
  # Internal rain observations are persisted even when the rounded watering
  # demand stays unchanged, but those silent writes do not trigger replanning.
  - condition: template
    value_template: >-
      {{
        status.get("valve") != valve_entity or
        status.get("interval") != watering_interval_days or
        status.get("runtime") != runtime_minutes or
        status.get("max_runtime", 0) != maximum_runtime_minutes or
        status.get("r") != credited_rain_minutes
      }}
  # Keep the shared helper within its known schema before updating calculation fields.
  - action: input_text.set_value
    target:
      entity_id: '{{ status_helper_entity }}'
    data:
      value: >-
        {%- set status = dict(status | dictsort | selectattr("0", "in",
          ["valve", "interval", "runtime", "max_runtime", "last_end",
            "cycle", "watered", "slot", "next", "r"]) | list) %}
        {%- set status = dict(status, valve=valve_entity,
          interval=watering_interval_days, runtime=runtime_minutes,
          r=credited_rain_minutes) %}
        {%- if maximum_runtime_minutes > 0 %}
          {%- set status = dict(status, max_runtime=maximum_runtime_minutes) %}
        {%- else %}
          {%- set status = status | dictsort | rejectattr("0", "eq", "max_runtime") | list %}
          {%- set status = dict(status) %}
        {%- endif %}
        {{ status | to_json }}
  - if:
      - condition: template
        value_template: '{{ runtime_changed }}'
    then:
      # Give the scheduler time to publish the resulting next run so one
      # calculation entry can include the useful plan without a second log.
      - delay:
          seconds: '{{ calculation_log_delay_seconds }}'
      - variables:
          updated_status: >-
            {%- set value = states(status_helper_entity) | from_json({}) %}
            {{ value if value is mapping else {} }}
          updated_next: '{{ updated_status.get("next") }}'
          remaining_minutes: >-
            {{ (([0, runtime_minutes * 60 - watered_before_calculation] | max) / 60) | round(0, "ceil") | int }}
      - action: logbook.log
        data:
          name: Hippo's Irrigation Zone Calculation
          message: >-
            {%- set ns = namespace(message="") %}
            {%- if is_rain_only_update %}
              {%- set ns.message = "Additional rain reduced watering demand from " ~
                (status.get("runtime", 0) | int) ~ " to " ~ runtime_minutes ~ " minutes. " ~
                "Total rain credit: " ~ credited_rain_minutes ~
                " minutes; previously observed: " ~ previous_rain_minutes ~ " minutes." %}
            {%- else %}
              {%- set ns.message = "Calculated " ~ runtime_minutes ~
                " minutes of watering demand for the current " ~ watering_interval_days ~
                "-day cycle: " ~ base_runtime_minutes ~ " minutes base runtime" %}
              {%- if temperature_adjustment_minutes >= 0 %}
                {%- set ns.message = ns.message ~ " + " ~ temperature_adjustment_minutes ~
                  " minutes due to heat" %}
              {%- else %}
                {%- set ns.message = ns.message ~ " - " ~ (0 - temperature_adjustment_minutes) ~
                  " minutes due to low temperature" %}
              {%- endif %}
              {%- set ns.message = ns.message ~ " (" ~ max_temperature ~ " °C)" %}
              {%- if soil_moisture_entity %}
                {%- set ns.message = ns.message ~ " + " ~ soil_adjustment_minutes ~
                  " minutes due to soil (current: " ~
                  ("%g" | format(soil_moisture | round(1))) ~ "%, target: " ~
                  ("%g" | format(target_soil_moisture_percentage)) ~ "%)" %}
              {%- endif %}
              {%- set ns.message = ns.message ~ " - " ~ applied_rain_minutes ~
                " minutes of rain" %}
              {%- if rain_credit_percentage != 100 %}
                {%- set ns.message = ns.message ~ " (" ~ rain_credit_percentage ~ "% credit)" %}
              {%- endif %}
              {%- set ns.message = ns.message ~ "." %}
            {%- endif %}
            {%- if watered_before_calculation > 0 and remaining_minutes > 0 %}
              {%- set ns.message = ns.message ~ " Remaining watering demand: " ~
                remaining_minutes ~ " minutes." %}
            {%- endif %}
            {%- if updated_next is sequence and updated_next | count >= 2 %}
              {%- set ns.message = ns.message ~ " Next run: " ~
                (updated_next[0] | as_datetime | as_local).strftime("%Y-%m-%d %H:%M") ~ "." %}
            {%- elif status.get("next") and remaining_minutes == 0 %}
              {%- set ns.message = ns.message ~ " The run scheduled for " ~
                (status.next[0] | as_datetime | as_local).strftime("%Y-%m-%d %H:%M") ~
                " is no longer needed." %}
            {%- endif %}
            {{ ns.message }}
          entity_id: '{{ valve_entity }}'
          domain: switch
